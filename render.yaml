# Render Blueprint: the STAGING API (see docs/deploy-staging.md).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once in the
# dashboard and never stored in git.
services:
  - type: web
    name: ph-healthcare-api-staging
    runtime: node
    # always on: the reminder, unpaid-cancellation and job-queue workers run inside this process,
    # and a free instance sleeps when idle
    plan: starter
    region: singapore
    branch: dev-branch-part-6
    autoDeploy: true
    # dev dependencies are needed to build (prisma, esbuild, typescript)
    buildCommand: npm ci --include=dev && npm run build
    # migrations run before the new version starts; a failed migration stops the deploy
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # staging runs production code with Stripe TEST keys
      - key: ALLOW_STRIPE_TEST_IN_PRODUCTION
        value: "true"
      # Render puts one proxy in front of the app: rate limits need the real client IP
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "10000"
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: BETTER_AUTH_SESSION_TOKEN_EXPIRES_IN
        value: 1d
      - key: BETTER_AUTH_SESSION_TOKEN_UPDATE_AGE
        value: 1d
      # generated by Render: long random values, different from development
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # set by you in the dashboard (docs/deploy-staging.md, step 3)
      - key: ACCESS_TOKEN_SECRET # must equal the frontend's ACCESS_TOKEN_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY # 32 bytes base64; keep a backup, losing it loses the encrypted data
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: EMAIL_SENDER_USER_SMTP_HOST
        sync: false
      - key: EMAIL_SENDER_USER_SMTP_PORT
        sync: false
      - key: EMAIL_SENDER_USER_USER
        sync: false
      - key: EMAIL_SENDER_USER_PASS
        sync: false
      - key: EMAIL_SENDER_USER_SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SENTRY_DSN
        sync: false
